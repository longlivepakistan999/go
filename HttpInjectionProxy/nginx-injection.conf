# Nginx 反向代理配置 - HTML 内容注入
# 此配置会在所有 HTML 页面中注入自定义内容

# 加载 sub_filter 模块（通常默认已加载）
# load_module modules/ngx_http_sub_module.so;

server {
    listen 80;
    server_name your-domain.com;

    # 后端服务器地址（你的实际 Web 服务）
    location / {
        proxy_pass http://127.0.0.1:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 关闭后端压缩，以便进行内容替换
        proxy_set_header Accept-Encoding "";

        # 启用内容替换
        sub_filter_once off;
        sub_filter_types text/html;

        # 在 <body> 后注入内容
        sub_filter '<body>' '<body>
<div style="background:#fffbe6;border-bottom:2px solid #ffe58f;padding:10px;text-align:center;font-size:14px;">
    <b>此网址属于 XXX 拥有</b>
</div>';

        # 也可以在 </body> 前注入
        # sub_filter '</body>' '
        # <div style="position:fixed;bottom:0;left:0;right:0;background:#fffbe6;padding:10px;text-align:center;">
        #     <b>此网址属于 XXX 拥有</b>
        # </div>
        # </body>';
    }
}

# HTTPS 版本
server {
    listen 443 ssl;
    server_name your-domain.com;

    ssl_certificate /path/to/cert.pem;
    ssl_certificate_key /path/to/key.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Accept-Encoding "";

        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter '<body>' '<body>
<div style="background:#fffbe6;border-bottom:2px solid #ffe58f;padding:10px;text-align:center;font-size:14px;">
    <b>此网址属于 XXX 拥有</b>
</div>';
    }
}
